[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "deployflow"
version = "0.1.0"
description = "A minimal task API used to demonstrate a production-minded CI/CD workflow."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162,<0.163",
    "uvicorn[standard]>=0.34,<0.35",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.16,<2.17",
    "pytest>=8.3,<9.0",
    "ruff>=0.11,<0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
