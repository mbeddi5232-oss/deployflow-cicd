name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  IMAGE_NAME: deployflow-ci:${{ github.sha }}
  TRIVY_VERSION: v0.76.1

jobs:
  quality:
    name: Ruff and pytest
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install development dependencies
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Run Ruff lint checks
        run: python -m ruff check .

      - name: Run Ruff format checks
        run: python -m ruff format --check .

      - name: Run pytest
        run: python -m pytest

  container-security:
    name: Container build and Trivy scan
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build local container image
        run: docker build --pull --tag "${IMAGE_NAME}" .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: image
          image-ref: ${{ env.IMAGE_NAME }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL

  publish:
    name: Publish immutable GHCR image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - quality
      - container-security
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare immutable image reference
        id: image
        shell: bash
        run: |
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "ref=${repository}:sha-${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Build publish candidate
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: |
          docker build --pull \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "${IMAGE_REF}" \
            .

      - name: Scan publish candidate with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: image
          image-ref: ${{ steps.image.outputs.ref }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Reject an existing immutable tag
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: |
          if inspect_output=$(docker manifest inspect "${IMAGE_REF}" 2>&1); then
            echo "::error::Refusing to overwrite existing image ${IMAGE_REF}"
            exit 1
          fi
          if ! printf '%s\n' "${inspect_output}" | grep -Eqi 'manifest unknown|no such manifest'; then
            echo "::error::Unable to prove that ${IMAGE_REF} is unused"
            printf '%s\n' "${inspect_output}"
            exit 1
          fi

      - name: Push commit-tagged image
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: docker push "${IMAGE_REF}"

      - name: Record published image
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: echo "Published \`${IMAGE_REF}\`" >> "${GITHUB_STEP_SUMMARY}"
